name: jadepinserver-hlappano
services:
  jadepinserver:
    build:
      context: ./
      dockerfile: Dockerfile
    image: hlappano/jade_pin_server:latest
    working_dir: /app
    ports:
      - "18081:5000"
      - "1234:4443"
    environment:
      PUBLIC_JADE_SERVER_PROXY_PORT: 1234
      PUBLIC_JADE_WEB_PROXY_PORT: 18081
      # PUBLIC_JADE_PROXY_HOST: "PROXY_HOST"
    volumes:
      # Key material lives here. Back this directory up - see README.
      - ./key_data:/app/key_data
    command: ["--no-tls", "--listen", "0.0.0.0", "--data-dir", "/app/key_data"]